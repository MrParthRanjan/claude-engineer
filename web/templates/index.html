<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCMP · Daily Intelligence</title>

  <!-- Instant theme — prevents flash before Alpine boots -->
  <script>
    if (localStorage.getItem('scmp_dark') === 'true')
      document.documentElement.classList.add('dark');
  </script>

  <link rel="stylesheet" href="/static/style.css" />
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine plugins MUST load before Alpine core -->
  <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body x-data="scmpApp()" x-cloak>

  <!-- ══ TOAST ══ -->
  <div
    x-show="showToast"
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="opacity-0 translate-y-3"
    x-transition:enter-end="opacity-100 translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-end="opacity-0 translate-y-2"
    class="toast fixed bottom-6 right-6 z-50 flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-medium"
    x-text="toastMsg">
  </div>

  <!-- ══ MASTHEAD ══ -->
  <header class="masthead sticky top-0 z-40">
    <div class="max-w-[1180px] mx-auto px-5">

      <div class="flex items-center justify-between gap-4 py-3.5">
        <!-- Brand -->
        <div class="min-w-0">
          <div class="flex items-baseline gap-2.5">
            <span class="masthead-title text-[19px] sm:text-[22px] lg:text-[25px] select-none">
              South China Morning Post
            </span>
          </div>
          <div class="flex items-center gap-2.5 mt-1.5">
            <span class="accent-rule"></span>
            <span class="kicker">Daily Intelligence</span>
            <span class="live-dot" title="Live"></span>
          </div>
        </div>

        <!-- Controls -->
        <div class="flex items-center gap-2 shrink-0">
          <div class="text-right hidden lg:block mr-1">
            <p class="meta" x-text="todayShort"></p>
            <p class="meta" x-show="lastUpdated">Updated <span x-text="lastUpdated"></span></p>
          </div>

          <button @click="refreshArticles()" :disabled="loading || refreshing"
                  class="btn btn-ghost px-3 py-2">
            <svg x-show="!refreshing" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
            </svg>
            <span x-show="refreshing" class="spinner" style="width:14px;height:14px"></span>
            <span class="hidden sm:inline" x-text="refreshing ? 'Updating' : 'Refresh'"></span>
          </button>

          <button @click="toggleDark()" class="icon-btn" :title="dark ? 'Light mode' : 'Dark mode'">
            <!-- Sun -->
            <svg x-show="!dark" width="17" height="17" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            <!-- Moon -->
            <svg x-show="dark" width="17" height="17" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Category tabs -->
      <nav class="tab-bar flex overflow-x-auto border-t" style="border-color: var(--border)">
        <template x-for="cat in categories" :key="cat">
          <button class="tab" :class="{ active: activeCategory === cat }"
                  @click="activeCategory = cat" x-text="cat"></button>
        </template>
      </nav>
    </div>
  </header>

  <!-- ══ STATS LINE ══ -->
  <div x-show="!loading && filteredArticles.length > 0"
       class="max-w-[1180px] mx-auto px-5 pt-5 pb-1">
    <p class="meta">
      <span x-text="filteredArticles.length"></span> stories
      <span x-show="activeCategory === 'All'"> · <span x-text="Object.keys(articles).length"></span> sections</span>
      <span x-show="activeCategory !== 'All'"> · <span x-text="activeCategory"></span></span>
    </p>
  </div>

  <!-- ══ MAIN ══ -->
  <main class="max-w-[1180px] mx-auto px-5 py-5">

    <!-- Skeleton -->
    <div x-show="loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <template x-for="i in 9" :key="i">
        <div class="surface p-5 space-y-3.5">
          <div class="flex items-center gap-2">
            <div class="skeleton h-2.5 w-2.5 rounded-full"></div>
            <div class="skeleton h-2.5 w-20"></div>
            <div class="skeleton h-2.5 w-14 ml-auto"></div>
          </div>
          <div class="skeleton h-4 w-full"></div>
          <div class="skeleton h-4 w-10/12"></div>
          <div class="skeleton h-3 w-full mt-1"></div>
          <div class="skeleton h-3 w-9/12"></div>
          <div class="flex gap-2 pt-2">
            <div class="skeleton h-9 flex-1 rounded-lg"></div>
            <div class="skeleton h-9 flex-1 rounded-lg"></div>
          </div>
        </div>
      </template>
    </div>

    <!-- Grid -->
    <div x-show="!loading && filteredArticles.length > 0"
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <template x-for="(article, idx) in filteredArticles" :key="article.title + idx">
        <article
          class="card card-enter flex flex-col"
          :style="`--cat-color:${categoryColor(article.category)}; animation-delay:${Math.min(idx,8)*65}ms`"
          x-data="{
            open: false, analysis: null, busy: false,
            async fetchAnalysis() {
              if (this.analysis) { this.open = !this.open; return; }
              this.open = true; this.busy = true;
              const p = new URLSearchParams({
                title: article.title,
                description: article.ai_summary || article.description || '',
                category: article.category || ''
              });
              try { this.analysis = await (await fetch('/api/analysis?'+p)).json(); }
              catch { this.analysis = { error: 'Analysis failed — check ANTHROPIC_API_KEY.' }; }
              this.busy = false;
            }
          }">

          <div class="p-5 flex flex-col flex-1">
            <!-- Section + time -->
            <div class="flex items-center gap-2 mb-3">
              <span class="cat-dot"></span>
              <span class="cat-label" x-text="article.category"></span>
              <span class="meta ml-auto" x-text="formatDate(article.published)"></span>
            </div>

            <!-- Headline -->
            <h2 class="headline mb-2.5" x-text="article.title"></h2>

            <!-- Summary -->
            <p class="summary" x-text="trimText(article.ai_summary || article.description, 200)"></p>

            <!-- Crux -->
            <div x-show="article.crux" class="crux">
              <span class="crux-label">Bottom&nbsp;line</span>
              <span class="crux-text" x-text="article.crux"></span>
            </div>

            <div class="flex-1 min-h-[0.75rem]"></div>

            <!-- Actions -->
            <div class="flex gap-2 mt-4">
              <a :href="article.link" target="_blank" rel="noopener noreferrer"
                 class="btn btn-ghost flex-1 py-2">
                Read article
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 17L17 7M9 7h8v8"/>
                </svg>
              </a>
              <button @click="fetchAnalysis()" class="analysis-btn btn btn-accent flex-1 py-2">
                <template x-if="!busy">
                  <span class="flex items-center gap-1.5">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
                    </svg>
                    <span x-text="analysis ? (open ? 'Hide analysis' : 'Show analysis') : 'Deep analysis'"></span>
                  </span>
                </template>
                <template x-if="busy">
                  <span class="flex items-center gap-1.5"><span class="spinner" style="width:12px;height:12px"></span> Analysing</span>
                </template>
              </button>
            </div>
          </div>

          <!-- Analysis panel -->
          <div x-show="open" x-collapse
               class="border-t" style="border-color: var(--border)">
            <div x-show="busy" class="p-5 flex items-center gap-2.5 meta" style="font-size:0.7rem">
              <span class="spinner"></span> Claude is analysing this story…
            </div>

            <div x-show="!busy && analysis && analysis.error"
                 class="p-4 text-xs" style="color: var(--accent)"
                 x-text="analysis && analysis.error"></div>

            <div x-show="!busy && analysis && !analysis.error" class="p-4 space-y-3 analysis-enter">
              <!-- TL;DR -->
              <div class="analysis-block block-tldr">
                <p class="analysis-label">Executive summary</p>
                <p class="lead" x-text="analysis && analysis.tldr"></p>
              </div>

              <!-- Key points -->
              <div class="analysis-block block-neutral">
                <p class="analysis-label">Key points</p>
                <ul class="space-y-2">
                  <template x-for="(pt,i) in (analysis && analysis.key_points || [])" :key="i">
                    <li class="kp-item"><span class="kp-marker">—</span><span x-text="pt"></span></li>
                  </template>
                </ul>
              </div>

              <!-- Why it matters + India/Asia -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="analysis-block block-neutral">
                  <p class="analysis-label">Why it matters</p>
                  <p class="analysis-text" x-text="analysis && analysis.why_it_matters"></p>
                </div>
                <div class="analysis-block block-neutral">
                  <p class="analysis-label">India &amp; Asia</p>
                  <p class="analysis-text" x-text="analysis && analysis.india_asia_impact"></p>
                </div>
              </div>

              <!-- Geopolitical -->
              <div class="analysis-block block-neutral">
                <p class="analysis-label">Geopolitical angle</p>
                <p class="analysis-text" x-text="analysis && analysis.geopolitical_angle"></p>
              </div>
            </div>
          </div>
        </article>
      </template>
    </div>

    <!-- Empty -->
    <div x-show="!loading && filteredArticles.length === 0"
         class="flex flex-col items-center justify-center py-32 text-center">
      <div class="surface w-16 h-16 flex items-center justify-center rounded-2xl mb-5">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
          <path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>
        </svg>
      </div>
      <p class="text-base font-semibold" style="color: var(--text-1)">No stories loaded</p>
      <p class="summary mt-1 mb-6" style="color: var(--text-3)">Feeds may be blocked or the network is offline.</p>
      <button @click="refreshArticles()" class="btn btn-solid px-5 py-2.5">Refresh now</button>
    </div>

    <!-- Footer -->
    <footer class="mt-16 pt-6 pb-10 text-center border-t" style="border-color: var(--border)">
      <p class="meta">South China Morning Post · Analysis by Claude · Built with FastAPI</p>
    </footer>
  </main>

  <script>
    function scmpApp() {
      return {
        dark: localStorage.getItem('scmp_dark') === 'true',
        loading: true, refreshing: false,
        articles: {}, activeCategory: 'All',
        lastUpdated: '', showToast: false, toastMsg: '',

        get categories() { return ['All', ...Object.keys(this.articles)]; },

        get filteredArticles() {
          const tag = (c, a) => a.map(x => ({ ...x, category: c }));
          if (this.activeCategory === 'All')
            return Object.entries(this.articles).flatMap(([c, a]) => tag(c, a));
          return tag(this.activeCategory, this.articles[this.activeCategory] || []);
        },

        get todayShort() {
          return new Date().toLocaleDateString('en-GB',
            { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
        },

        async init() { await this.loadArticles(); },

        async loadArticles() {
          this.loading = true;
          try {
            const r = await fetch('/api/articles');
            if (!r.ok) throw 0;
            this.articles = await r.json();
            this.lastUpdated = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
          } catch { this.articles = {}; }
          this.loading = false;
        },

        async refreshArticles() {
          this.refreshing = true;
          try {
            await fetch('/api/refresh', { method: 'POST' });
            await this.loadArticles();
            this.fireToast(`Updated · ${this.filteredArticles.length} stories`);
          } catch { this.fireToast('Refresh failed — check network'); }
          this.refreshing = false;
        },

        toggleDark() {
          this.dark = !this.dark;
          document.documentElement.classList.toggle('dark', this.dark);
          localStorage.setItem('scmp_dark', this.dark);
        },

        fireToast(msg) {
          this.toastMsg = msg; this.showToast = true;
          clearTimeout(this._t);
          this._t = setTimeout(() => this.showToast = false, 2800);
        },

        trimText(t, n) { return !t ? '' : (t.length > n ? t.slice(0, n).trimEnd() + '…' : t); },

        formatDate(pub) {
          if (!pub) return '';
          const p = pub.split(',');
          return (p.length > 1 ? p[1].trim() : pub.slice(0, 12)).toUpperCase();
        },

        categoryColor(cat) {
          const m = {
            'Top Stories': 'var(--cat-top)',
            'Hong Kong':   'var(--cat-hk)',
            'China':       'var(--cat-china)',
            'Asia':        'var(--cat-asia)',
            'World':       'var(--cat-world)',
            'Business':    'var(--cat-biz)',
            'Technology':  'var(--cat-tech)',
          };
          return m[cat] || 'var(--accent)';
        }
      };
    }
  </script>
</body>
</html>
